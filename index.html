<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Headshot Background Page</title>
    <style>
        body {
            margin: 0;
            padding: 2rem;
            background: white;
            /* white visible border */
            box-sizing: border-box;
            font-family: 'Times New Roman', serif;
            font-weight: 300;
            color: white;
            height: 100vh;
            overflow: hidden;
            /* Optional: removes scrollbars if image fits */
        }

        .header {
            letter-spacing: 0.5rem;
            padding: 1rem;
        }

        .header h1 {
            font-weight: 500;
        }

        .header h2 {
            margin-bottom: 0.5rem;
        }

        .media-btn {
            /* max-width: 4rem; */
            background-color: white;
            border: none;
            border-radius: 0.5rem;
            margin-left: 1rem;
            padding: 0.5rem 1.5rem;
        }

        .media-btn:hover {
            background-color: rgb(221, 221, 221);
            cursor: pointer;
        }

        /* Base styles */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgb(13, 13, 13);
            font-family: sans-serif;
            height: 5rem;
            border-radius: 0.5rem 0.5rem 0 0;
        }

        .nav-brand {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .nav-links {
            list-style: none;
            display: none;
            flex-direction: column;
            gap: 1rem;
            padding-left: 0;
        }

        .nav-links li a {
            text-decoration: none;
            color: #333;
        }

        /* Toggle button */
        .nav-toggle {
            font-size: 1.5rem;
            background: none;
            border: none;
            cursor: pointer;
        }

        /* Show menu when open (JS will toggle 'open' class) */
        .navbar.open .nav-links {
            display: flex;
        }

        /* Larger screens */
        @media (min-width: 768px) {
            .nav-toggle {
                display: none;
            }

            .nav-links {
                display: flex !important;
                flex-direction: row;
                gap: 2rem;
            }
        }

        .main {
            width: 100%;
            height: 100%;
            background: url('background.jpg') no-repeat center center;
            background-size: cover;
            border-radius: 0.5rem;
            position: relative;
        }

        .content {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            position: absolute;
            bottom: 1rem;
            right: 1rem;
            padding: 1rem;
            width: calc(100% - 4rem);
            max-height: 350px;
            /* adjust to your needs */
            overflow-y: auto;

            /* Optional nice scroll styling */
            scrollbar-width: thin;
            scrollbar-color: white transparent;
        }

        .content::-webkit-scrollbar {
            width: 8px;
        }

        .content::-webkit-scrollbar-track {
            background: transparent;
        }

        .content::-webkit-scrollbar-thumb {
            background-color: white;
            border-radius: 4px;
        }

        .section {
            margin: 0;
            width: 100%;
        }

        .title {
            margin: 0;
        }

        .section-title {
            color: black;
            font-weight: 300;
            margin: 0;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 1.5rem;
            font-weight: 300;
            margin: 0;
            margin-bottom: 1rem;
        }

        .download-link {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background-color: white;
            color: black;
            text-decoration: none;
            font-weight: 600;
            border-radius: 6px;
            transition: background-color 0.3s ease, color 0.3s ease;
            box-shadow: 0 2px 8px rgba(255, 255, 255, 0.2);
        }

        .download-link:hover {
            background-color: #e0e0e0;
            color: #111;
        }

        .video {
            width: 100%;
            height: 236px;
            max-width: 420px;
            object-fit: cover;
        }

        /* Backdrop to dim background */
        .modal-backdrop {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        /* Active class triggers fade-in */
        .modal-backdrop.show {
            opacity: 1;
            visibility: visible;
        }

        /* .hidden keeps it out of the DOM flow initially */
        .modal-backdrop.hidden {
            display: none;
        }

        /* Modal container */
        .modal {
            background: white;
            border-radius: 8px;
            max-height: 80vh;
            /* width: 90%; */
            max-width: 1000px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Scrollable content */
        .modal-content {
            overflow-y: auto;
            padding: 1.5rem;
            max-height: 80vh;
        }

        /* Optional: smooth scroll and clean scrollbar */
        .modal-content::-webkit-scrollbar {
            width: 6px;
        }

        .modal-content::-webkit-scrollbar-thumb {
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 3px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <!-- <nav class="navbar">
        <div class="nav-brand">Daniel Berryman</div>
        <button class="nav-toggle" aria-label="Toggle Menu">☰</button>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Work</a></li>
            <li><a href="resume.pdf" download class="download-link">Resume</a></li>
        </ul>
    </nav> -->
    <main class="main">
        <div class="header">
            <h2 class="subtitle"><i>American Tenor</i></h2>
            <h1 class="title">Daniel Berryman</h1>
        </div>
        <button class="media-btn" onclick="toggleModal()">Media</button>
        <div id="myModal" class="modal-backdrop hidden" onclick="toggleModal(event)">
            <div class="modal" onclick="event.stopPropagation()">
                <div class="modal-content">
                    <div class="section">
                        <h2 class="section-title">Premiere Opera Foundation, 2024</h2>
                        <iframe class="video"
                            src="https://www.youtube.com/embed/msJFbDEqWG8?si=lIID09GMpJvSB4QP&amp;start=14"
                            title="YouTube video player" frameborder="0"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                            referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>
                        </iframe>
                    </div>
                    <div class="section">
                        <h2 class="section-title">The Opera Next Door, 2025</h2>
                        <iframe class="video"
                            src="https://www.youtube.com/embed/UsZNpokpDQQ?si=YCv4X_kcwNKLM_An&amp;start=25"
                            title="YouTube video player" frameborder="0"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                            referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>
                        </iframe>
                    </div>
                </div>
            </div>
        </div>
        <!-- 
        <div class="content">

        </div> -->
    </main>

    <script>
        function toggleModal(event) {
            const modal = document.getElementById('myModal');

            if (!event || event.target === modal) {
                if (modal.classList.contains('hidden')) {
                    // Show it
                    modal.classList.remove('hidden');
                    requestAnimationFrame(() => {
                        modal.classList.add('show');
                    });
                } else {
                    // Fade out, then hide after animation
                    modal.classList.remove('show');
                    setTimeout(() => {
                        modal.classList.add('hidden');
                    }, 300); // Match transition duration
                }
            }
        }
    </script>
</body>

</html>
